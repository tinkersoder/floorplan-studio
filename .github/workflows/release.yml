name: Release

# Push a tag like v0.1.0 -> builds the HACS plugin bundle and publishes a
# GitHub release with floorplan-studio.js attached (the asset HACS installs).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:hacs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-hacs/floorplan-studio.js
          generate_release_notes: true
